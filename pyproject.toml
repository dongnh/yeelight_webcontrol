[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yeelight-web-controller"
version = "0.5.0"
description = "Yeelight LAN control bridge — REST API compatible with matter_webcontrol federation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "yeelight",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx",
]

[project.scripts]
yeelight-srv = "cli.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
